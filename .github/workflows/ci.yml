name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pipeline:
    uses: jjackson0118/delivery-gates/.github/workflows/reusable-jvm-pipeline.yml@d18ea16be1b52e288adae887fc981ff7fb8b974b
    with:
      java-version: "21"
      gates-ref: d18ea16be1b52e288adae887fc981ff7fb8b974b
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/decide-test.sh
      - run: bash deploy/orchestrate-test.sh
      - run: bash deploy/ci-deploy-test.sh
      - run: python3 -m unittest discover -s deploy -p '*_test.py'
  deploy:
    needs: [pipeline, deploy-scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      SMOKE_URL: ${{ vars.SMOKE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jjackson0118/delivery-gates
          ref: d18ea16be1b52e288adae887fc981ff7fb8b974b
          path: .delivery-gates
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build artifact with immutable commit identity
        run: ./gradlew :api:bootJar -PbuildSha="$GITHUB_SHA"
      - name: Validate deployment configuration
        shell: bash
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SMOKE_URL" =~ ^http://[a-zA-Z0-9.-]+:[0-9]+$ ]]
      - name: Join private deploy network
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Deploy, verify, and recover on a demonstrated defect
        shell: bash
        run: |
          shopt -s nullglob
          jars=()
          for jar in api/build/libs/*.jar; do
            [[ "$jar" == *-plain.jar ]] || jars+=("$jar")
          done
          [[ "${#jars[@]}" -eq 1 ]]
          bash deploy/ci-deploy.sh "${jars[0]}" .delivery-gates
      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence
          path: deploy-evidence/
          if-no-files-found: warn
