# This repository does not define its own gates. It consumes the paved road
# from delivery-gates, so a gate improvement arrives here through a version
# bump rather than through an edit to this file.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    uses: jjackson0118/delivery-gates/.github/workflows/reusable-jvm-pipeline.yml@main
    with:
      java-version: "21"
      gates-ref: main

  # The deploy scripts are shell, so the JVM pipeline above does not test them.
  # decide.sh is the control that decides whether a bad release is withdrawn,
  # and a reviewer got a previous version to answer "keep, verified" for a
  # report ordering a rollback -- so its corpus runs here rather than living in
  # a directory nothing executes.
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decide.sh reads the smoke report faithfully
        run: ./deploy/decide-test.sh

